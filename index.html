<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEW TECH | Sistema de Gestión</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0c10;
            --bg-card: #161b22;
            --bg-input: #0d1117;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --accent: #2ea043;
            --accent-glow: rgba(46, 160, 67, 0.3);
            --danger: #f85149;
            --border: #30363d;
            --neon: #39FF14;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main);
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* --- LOADING SCREEN --- */
        #loading-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg-main);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--neon);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- LOGIN SCREEN --- */
        #login-screen {
            height: 100vh; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #161b22 0%, #0a0c10 100%);
        }
        .login-card {
            background: var(--bg-card);
            padding: 40px; border-radius: 12px;
            border: 1px solid var(--border);
            width: 100%; max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .brand-logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 42px; font-weight: 700;
            color: var(--neon); letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }
        .btn-google {
            background: white; color: #1f2328;
            border: none; padding: 12px 24px;
            border-radius: 6px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center;
            gap: 12px; width: 100%; justify-content: center;
            margin-top: 30px; transition: transform 0.2s;
        }
        .btn-google:hover { transform: translateY(-2px); }

        /* --- WAITING SCREEN --- */
        #waiting-screen {
            height: 100vh; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }
        .waiting-box {
            background: var(--bg-card);
            padding: 40px; border-radius: 12px;
            border: 1px solid var(--border);
            max-width: 500px;
        }

        /* --- DASHBOARD --- */
        #app-dashboard { display: none; min-height: 100vh; }
        
        header {
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 12px 5%;
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }
        .user-profile {
            display: flex; align-items: center; gap: 12px;
            cursor: pointer; padding: 4px 12px;
            border-radius: 20px; transition: background 0.2s;
        }
        .user-profile:hover { background: var(--border); }
        .avatar {
            width: 32px; height: 32px;
            border-radius: 50%; border: 2px solid var(--neon);
            object-fit: cover; background: #30363d;
        }

        main { padding: 40px 5%; max-width: 1200px; margin: 0 auto; }

        .section-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px; margin-bottom: 30px;
            overflow: hidden;
        }
        .section-header {
            padding: 16px 20px;
            background: rgba(48, 54, 61, 0.2);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .section-title { font-family: 'Rajdhani', sans-serif; font-size: 20px; color: var(--neon); }

        .item-row {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: grid; grid-template-columns: 1fr auto auto auto;
            align-items: center; gap: 20px;
        }
        .item-row:last-child { border-bottom: none; }
        .item-name { font-weight: 500; }
        .item-sub { font-size: 12px; color: var(--text-muted); }
        .badge {
            padding: 2px 10px; border-radius: 12px;
            font-size: 12px; font-weight: 600;
            background: var(--border);
        }

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 1000; display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px; width: 100%; max-width: 450px;
            padding: 30px; position: relative;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
        input, select {
            width: 100%; background: var(--bg-input);
            border: 1px solid var(--border);
            color: white; padding: 10px; border-radius: 6px;
            outline: none;
        }
        input:focus { border-color: var(--neon); }
        .btn-primary {
            background: var(--accent); color: white;
            border: none; padding: 12px; border-radius: 6px;
            width: 100%; font-weight: 600; cursor: pointer;
        }

        /* --- UTILS --- */
        .show { display: flex !important; }
        .hide { display: none !important; }
        .btn-logout { 
            background: transparent; border: 1px solid var(--border);
            color: var(--text-muted); padding: 6px 12px; border-radius: 6px;
            cursor: pointer; font-size: 12px;
        }
        .btn-logout:hover { color: white; border-color: white; }
    </style>
</head>
<body>

    <!-- PANTALLA DE CARGA -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <p style="letter-spacing: 2px; font-size: 12px; color: var(--text-muted);">SISTEMA DE GESTIÓN</p>
    </div>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen">
        <div class="login-card">
            <h1 class="brand-logo">NEW TECH</h1>
            <p style="color: var(--text-muted); font-size: 14px;">Inventario & Control de Acceso</p>
            <button class="btn-google" onclick="signIn()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/hf/google.svg" width="18">
                Entrar con Google
            </button>
            <p id="login-error" style="color: var(--danger); font-size: 12px; margin-top: 15px;"></p>
        </div>
    </div>

    <!-- PANTALLA DE ESPERA -->
    <div id="waiting-screen">
        <div class="waiting-box">
            <h2 style="color: var(--neon); margin-bottom: 20px;">ACCESO RESTRINGIDO</h2>
            <p style="margin-bottom: 25px;">Tu cuenta ha sido registrada, pero necesitas la autorización del administrador para entrar al sistema.</p>
            <div id="user-email-tag" style="background: var(--bg-input); padding: 10px; border-radius: 6px; margin-bottom: 30px; font-family: monospace;"></div>
            <button class="btn-logout" onclick="signOut()">Cerrar Sesión</button>
        </div>
    </div>

    <!-- DASHBOARD PRINCIPAL -->
    <div id="app-dashboard">
        <header>
            <div style="display: flex; align-items: center; gap: 15px;">
                <h2 class="brand-logo" style="font-size: 24px; margin: 0;">NEW TECH</h2>
            </div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="user-profile" onclick="openProfileModal()">
                    <span id="display-name" style="font-size: 14px; font-weight: 500;"></span>
                    <img id="display-avatar" class="avatar" src="">
                </div>
                <button class="btn-logout" onclick="signOut()">Salir</button>
            </div>
        </header>

        <main>
            <!-- SECCIÓN DE AUDITORÍA (Solo Propietario) -->
            <div id="admin-panel" style="display: none;">
                <div class="section-card">
                    <div class="section-header">
                        <h3 class="section-title">CONTROL DE USUARIOS</h3>
                    </div>
                    <div id="users-list">
                        <!-- Usuarios cargados aquí -->
                    </div>
                </div>
            </div>

            <!-- SECCIÓN DE INVENTARIO -->
            <div id="inventory-sections">
                <!-- Secciones de inventario aquí -->
            </div>

            <div id="editor-tools" style="display: none; margin-top: 20px;">
                <button class="btn-primary" style="background: var(--border); width: auto;" onclick="addSection()">+ Nueva Sección</button>
            </div>
        </main>
    </div>

    <!-- MODAL DE PERFIL -->
    <div id="profile-modal" class="modal-overlay" onclick="closeModals(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="margin-bottom: 20px; color: var(--neon);">MI PERFIL</h3>
            <div class="form-group">
                <label>Nombre Público</label>
                <input type="text" id="edit-name">
            </div>
            <div class="form-group">
                <label>URL de Foto de Perfil</label>
                <input type="text" id="edit-avatar">
            </div>
            <button class="btn-primary" onclick="updateProfile()">Guardar Cambios</button>
            <button class="btn-logout" style="width: 100%; margin-top: 10px;" onclick="closeModals()">Cancelar</button>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN
        const SB_URL = "https://smthghqwzkjrtkfnlswd.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdGhnaHF3emtqcnRrZm5sc3dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTQzNzIsImV4cCI6MjA5NjE3MDM3Mn0.mh5JaICtodlyZZ-7NyJdu-r7vwAp8mGwM6dJj0CqqpE";
        const OWNER_EMAIL = "edu.e.ascanio@gmail.com";

        const sb = supabase.createClient(SB_URL, SB_KEY);
        let currentUser = null;

        // INICIALIZACIÓN
        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            
            sb.auth.onAuthStateChange((event, session) => {
                if (session) {
                    checkUser(session.user);
                } else {
                    showView('login-screen');
                }
            });

            if (!session) {
                showView('login-screen');
            }
        }

        // CONTROL DE VISTAS
        function showView(viewId) {
            document.getElementById('loading-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('waiting-screen').style.display = 'none';
            document.getElementById('app-dashboard').style.display = 'none';
            
            const view = document.getElementById(viewId);
            if (view) view.style.display = (viewId === 'app-dashboard') ? 'block' : 'flex';
        }

        // AUTENTICACIÓN
        async function signIn() {
            const { error } = await sb.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + window.location.pathname }
            });
            if (error) document.getElementById('login-error').innerText = error.message;
        }

        async function signOut() {
            await sb.auth.signOut();
            window.location.reload();
        }

        // VERIFICACIÓN DE USUARIO & ROLES
        async function checkUser(authUser) {
            const email = authUser.email;
            let { data: user, error } = await sb.from('nt_users').select('*').eq('email', email).maybeSingle();

            if (!user) {
                // Auto-registro inicial
                const isOwner = email.toLowerCase() === OWNER_EMAIL.toLowerCase();
                const { data: newUser, error: insErr } = await sb.from('nt_users').insert({
                    email: email,
                    name: authUser.user_metadata.full_name || email,
                    avatar: authUser.user_metadata.avatar_url,
                    role: isOwner ? 'owner' : 'viewer',
                    authorized: isOwner
                }).select().single();
                user = newUser;
            }

            if (!user.authorized) {
                document.getElementById('user-email-tag').innerText = email;
                showView('waiting-screen');
                return;
            }

            currentUser = user;
            setupDashboard();
        }

        // DASHBOARD
        function setupDashboard() {
            showView('app-dashboard');
            document.getElementById('display-name').innerText = currentUser.name;
            document.getElementById('display-avatar').src = currentUser.avatar || 'https://ui-avatars.com/api/?name=' + currentUser.name;
            
            if (currentUser.role === 'owner') {
                document.getElementById('admin-panel').style.display = 'block';
                loadUsers();
            }

            if (currentUser.role === 'owner' || currentUser.role === 'editor') {
                document.getElementById('editor-tools').style.display = 'block';
            }

            loadInventory();
        }

        // GESTIÓN DE USUARIOS
        async function loadUsers() {
            const { data: users } = await sb.from('nt_users').select('*').order('created_at');
            const list = document.getElementById('users-list');
            list.innerHTML = users.map(u => `
                <div class="item-row">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <img src="${u.avatar || ''}" class="avatar" style="width:24px; height:24px;">
                        <div>
                            <div class="item-name">${u.name}</div>
                            <div class="item-sub">${u.email}</div>
                        </div>
                    </div>
                    <div>
                        <span class="badge" style="color: ${u.authorized ? 'var(--neon)' : 'var(--danger)'}">
                            ${u.authorized ? 'ACTIVO' : 'PENDIENTE'}
                        </span>
                    </div>
                    <div>
                        <select onchange="updateUserRole('${u.id}', this.value)" style="width: auto; padding: 2px 5px; font-size: 11px;">
                            <option value="viewer" ${u.role === 'viewer' ? 'selected' : ''}>Lector</option>
                            <option value="editor" ${u.role === 'editor' ? 'selected' : ''}>Editor</option>
                            <option value="owner" ${u.role === 'owner' ? 'selected' : ''}>Dueño</option>
                        </select>
                    </div>
                    <div>
                        ${!u.authorized ? 
                            `<button onclick="authorizeUser('${u.id}', true)" style="color: var(--neon); background: none; border: none; cursor: pointer; font-size: 12px; font-weight: bold;">AUTORIZAR</button>` : 
                            `<button onclick="authorizeUser('${u.id}', false)" style="color: var(--danger); background: none; border: none; cursor: pointer; font-size: 12px;">REVOCAR</button>`
                        }
                    </div>
                </div>
            `).join('');
        }

        async function authorizeUser(id, status) {
            await sb.from('nt_users').update({ authorized: status }).eq('id', id);
            loadUsers();
        }

        async function updateUserRole(id, role) {
            await sb.from('nt_users').update({ role: role }).eq('id', id);
            loadUsers();
        }

        // INVENTARIO (Simplificado para esta versión)
        async function loadInventory() {
            const { data: sections } = await sb.from('nt_sections').select('*').order('sort_order');
            const { data: items } = await sb.from('nt_items').select('*').order('sort_order');
            
            const container = document.getElementById('inventory-sections');
            container.innerHTML = sections.map(s => `
                <div class="section-card">
                    <div class="section-header">
                        <h3 class="section-title">${s.title}</h3>
                    </div>
                    <div>
                        ${items.filter(i => i.section_id === s.id).map(i => `
                            <div class="item-row">
                                <div>
                                    <div class="item-name">${i.name}</div>
                                    <div class="item-sub">${i.subtitle || ''}</div>
                                </div>
                                <div class="badge">Stock: ${i.quantity}</div>
                                <div style="font-weight: bold; color: var(--neon);">$${i.price}</div>
                            </div>
                        `).join('') || '<div style="padding: 20px; text-align: center; color: var(--text-muted);">Sin items</div>'}
                    </div>
                </div>
            `).join('');
        }

        // PERFIL
        function openProfileModal() {
            document.getElementById('edit-name').value = currentUser.name;
            document.getElementById('edit-avatar').value = currentUser.avatar || '';
            document.getElementById('profile-modal').classList.add('show');
        }

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('show'));
        }

        async function updateProfile() {
            const newName = document.getElementById('edit-name').value;
            const newAvatar = document.getElementById('edit-avatar').value;
            
            const { error } = await sb.from('nt_users').update({
                name: newName,
                avatar: newAvatar
            }).eq('id', currentUser.id);

            if (!error) {
                currentUser.name = newName;
                currentUser.avatar = newAvatar;
                setupDashboard();
                closeModals();
            }
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEW TECH | Sistema de Gestión</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #050a0e;
            --bg-card: #0d1117;
            --bg-input: #161b22;
            --text-main: #e2e8f0;
            --text-muted: #4a6070;
            --neon: #39FF14;
            --neon-glow: rgba(57, 255, 20, 0.3);
            --border: #1e2d3d;
            --danger: #ef4444;
            --blue: #38bdf8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- LOADING --- */
        #loading-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg-main);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--neon);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- LOGIN --- */
        #login-screen {
            height: 100vh; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #0d1117 0%, #050a0e 100%);
        }
        .login-card {
            background: var(--bg-card);
            padding: 40px; border-radius: 12px;
            border: 1px solid var(--border);
            width: 100%; max-width: 360px;
            text-align: center;
        }
        .brand-logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 48px; font-weight: 700;
            color: var(--neon); letter-spacing: 4px;
            text-shadow: 0 0 15px var(--neon-glow);
            margin-bottom: 30px;
        }
        .btn-google {
            background: white; color: #1a1a1a;
            border: none; padding: 12px 20px;
            border-radius: 8px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center;
            gap: 12px; width: 100%; justify-content: center;
            font-family: 'Inter', sans-serif;
            transition: transform 0.2s;
        }
        .btn-google:hover { transform: translateY(-2px); }

        /* --- WAITING --- */
        #waiting-screen {
            height: 100vh; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }

        /* --- DASHBOARD --- */
        #app-dashboard { display: none; }
        header {
            background: rgba(5, 10, 14, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--neon);
            padding: 10px 5%;
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
        }
        .h-logo { width: 45px; height: 45px; border-radius: 8px; overflow: hidden; }
        .h-logo img { width: 100%; height: 100%; object-fit: contain; }
        
        .user-profile {
            display: flex; align-items: center; gap: 12px;
            cursor: pointer;
        }
        .avatar {
            width: 34px; height: 34px;
            border-radius: 50%; border: 2px solid var(--neon);
            object-fit: cover;
        }

        main { padding: 40px 5%; max-width: 1000px; margin: 0 auto; }

        /* --- SECCIONES --- */
        .section-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px; margin-bottom: 30px;
        }
        .section-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .section-title { font-family: 'Rajdhani', sans-serif; font-size: 22px; color: var(--neon); }

        .item-row {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: grid; grid-template-columns: 1fr auto auto auto;
            align-items: center; gap: 15px;
        }
        .item-row:last-child { border-bottom: none; }
        
        /* --- BOTONES --- */
        .btn {
            padding: 8px 16px; border-radius: 6px; border: none;
            font-weight: 600; cursor: pointer; font-size: 12px;
            transition: all 0.2s;
        }
        .btn-neon { background: transparent; color: var(--neon); border: 1px solid var(--neon); }
        .btn-neon:hover { background: var(--neon-glow); }
        .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }
        .btn-save { background: var(--neon); color: #000; }

        /* --- MODALES --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 1000; display: none; align-items: center; justify-content: center;
        }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px; width: 90%; max-width: 400px;
            padding: 25px;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; }
        input, select {
            width: 100%; background: var(--bg-input);
            border: 1px solid var(--border);
            color: white; padding: 10px; border-radius: 6px;
            outline: none; font-family: 'Inter', sans-serif;
        }
        input:focus { border-color: var(--neon); }

        .show { display: flex !important; }
        .hide { display: none !important; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
    </div>

    <div id="login-screen">
        <h1 class="brand-logo">NEW TECH</h1>
        <div class="login-card">
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 25px;">Acceso exclusivo para personal autorizado.</p>
            <button class="btn-google" onclick="signIn()">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                CONTINUAR CON GOOGLE
            </button>
        </div>
    </div>

    <div id="waiting-screen">
        <h2 style="color: var(--neon); margin-bottom: 15px;">ACCESO PENDIENTE</h2>
        <p style="color: var(--text-muted); max-width: 300px; margin-bottom: 30px;">Tu cuenta ha sido registrada. El administrador debe autorizarte para continuar.</p>
        <button class="btn btn-danger" onclick="signOut()">CERRAR SESIÓN</button>
    </div>

                <div class="section-card">
                    <div class="section-header">
                        <h3 class="section-title">CONTROL DE ACCESOS</h3>
                    </div>
                    <div id="users-list"></div>
                </div>
            </div>

            <!-- INVENTARIO -->
            <div id="inventory-container"></div>
            
            <div id="editor-controls" style="display:none; text-align:center; margin-top:20px;">
                <button class="btn btn-neon" onclick="openModal('section-modal')">+ NUEVA SECCIÓN</button>
            </div>
        </main>
    </div>

    <!-- MODAL PERFIL -->
    <div id="profile-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color:var(--neon); margin-bottom:20px;">MI PERFIL</h3>
            <div class="form-group">
                <label>Nombre Público</label>
                <input type="text" id="p-name">
            </div>
            <div class="form-group">
                <label>URL Foto de Perfil</label>
                <input type="text" id="p-avatar">
            </div>
            <button class="btn btn-save" style="width:100%;" onclick="saveProfile()">GUARDAR</button>
            <button class="btn btn-danger" style="width:100%; margin-top:10px;" onclick="closeModal('profile-modal')">CANCELAR</button>
        </div>
    </div>

    <!-- MODAL SECCIÓN -->
    <div id="section-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color:var(--neon); margin-bottom:20px;">NUEVA SECCIÓN</h3>
            <div class="form-group">
                <label>Nombre de la Sección</label>
                <input type="text" id="s-title" placeholder="Ej: REPUESTOS">
            </div>
            <button class="btn btn-save" style="width:100%;" onclick="saveSection()">CREAR SECCIÓN</button>
            <button class="btn btn-danger" style="width:100%; margin-top:10px;" onclick="closeModal('section-modal')">CANCELAR</button>
        </div>
    </div>

    <!-- MODAL ITEM -->
    <div id="item-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="item-modal-title" style="color:var(--neon); margin-bottom:20px;">NUEVO ITEM</h3>
            <input type="hidden" id="i-id">
            <input type="hidden" id="i-sid">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="i-name">
            </div>
            <div class="form-group">
                <label>Subtítulo / Marca</label>
                <input type="text" id="i-sub">
            </div>
            <div style="display:flex; gap:10px;">
                <div class="form-group" style="flex:1;">
                    <label>Stock</label>
                    <input type="number" id="i-qty">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>Precio</label>
                    <input type="number" id="i-price">
                </div>
            </div>
            <button class="btn btn-save" style="width:100%;" onclick="saveItem()">GUARDAR ITEM</button>
            <button class="btn btn-danger" style="width:100%; margin-top:10px;" onclick="closeModal('item-modal')">CANCELAR</button>
        </div>
    </div>

    <script>
        const SB_URL = "https://smthghqwzkjrtkfnlswd.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtdGhnaHF3emtqcnRrZm5sc3dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTQzNzIsImV4cCI6MjA5NjE3MDM3Mn0.mh5JaICtodlyZZ-7NyJdu-r7vwAp8mGwM6dJj0CqqpE";
        const OWNER_EMAIL = "edu.e.ascanio@gmail.com";
        const sb = supabase.createClient(SB_URL, SB_KEY);

        let currentUser = null;
        let sections = [];
        let items = [];

        async function init() {
            const { data: { session } } = await sb.auth.getSession();
            sb.auth.onAuthStateChange((event, session) => {
                if (session) checkUser(session.user);
                else showView('login-screen');
            });
            if (!session) showView('login-screen');
        }

        function showView(id) {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('waiting-screen').style.display = 'none';
            document.getElementById('app-dashboard').style.display = 'none';
            const v = document.getElementById(id);
            v.style.display = (id === 'app-dashboard') ? 'block' : 'flex';
        }

        async function signIn() {
            await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + window.location.pathname } });
        }

        async function signOut() {
            await sb.auth.signOut();
            window.location.reload();
        }

        async function checkUser(authUser) {
            let { data: user } = await sb.from('nt_users').select('*').eq('email', authUser.email).maybeSingle();
            if (!user) {
                const isOwner = authUser.email.toLowerCase() === OWNER_EMAIL.toLowerCase();
                const { data: newUser } = await sb.from('nt_users').insert({
                    email: authUser.email,
                    name: authUser.user_metadata.full_name || authUser.email,
                    avatar: authUser.user_metadata.avatar_url,
                    role: isOwner ? 'owner' : 'viewer',
                    authorized: isOwner
                }).select().single();
                user = newUser;
            }
            // LLAVE MAESTRA: Si eres el dueño, te autorizamos SIEMPRE
            const isOwner = email.toLowerCase() === OWNER_EMAIL.toLowerCase();
            if (isOwner) {
                user.authorized = true;
                user.role = 'owner';
                // Auto-corregir en la base de datos si estaba mal
                await sb.from('nt_users').update({ authorized: true, role: 'owner' }).eq('id', user.id);
            }

            if (!user.authorized) return showView('waiting-screen');
            currentUser = user;
            setupApp();
        }

        function setupApp() {
            showView('app-dashboard');
            document.getElementById('h-name').innerText = currentUser.name;
            document.getElementById('h-avatar').src = currentUser.avatar || 'https://ui-avatars.com/api/?name=' + currentUser.name;
            if (currentUser.role === 'owner') {
                document.getElementById('audit-panel').style.display = 'block';
                loadUsers();
            }
            if (currentUser.role === 'owner' || currentUser.role === 'editor') {
                document.getElementById('editor-controls').style.display = 'block';
            }
            loadInventory();
        }

        async function loadUsers() {
            const { data: users } = await sb.from('nt_users').select('*').order('created_at');
            document.getElementById('users-list').innerHTML = users.map(u => `
                <div class="item-row">
                    <div>
                        <div style="font-weight:600; font-size:13px;">${u.name}</div>
                        <div style="font-size:11px; color:var(--text-muted);">${u.email}</div>
                    </div>
                    <select onchange="updateUserRole('${u.id}', this.value)" style="width:auto; font-size:10px; padding:2px 5px;">
                        <option value="viewer" ${u.role === 'viewer' ? 'selected' : ''}>LECTOR</option>
                        <option value="editor" ${u.role === 'editor' ? 'selected' : ''}>EDITOR</option>
                        <option value="owner" ${u.role === 'owner' ? 'selected' : ''}>DUEÑO</option>
                    </select>
                    <button class="btn ${u.authorized ? 'btn-danger' : 'btn-neon'}" onclick="toggleAuth('${u.id}', ${!u.authorized})">
                        ${u.authorized ? 'REVOCAR' : 'AUTORIZAR'}
                    </button>
                </div>
            `).join('');
        }

        async function toggleAuth(id, status) { await sb.from('nt_users').update({ authorized: status }).eq('id', id); loadUsers(); }
        async function updateUserRole(id, role) { await sb.from('nt_users').update({ role: role }).eq('id', id); loadUsers(); }

        async function loadInventory() {
            const { data: secs } = await sb.from('nt_sections').select('*').order('sort_order');
            const { data: its } = await sb.from('nt_items').select('*').order('sort_order');
            sections = secs || []; items = its || [];
            
            document.getElementById('inventory-container').innerHTML = sections.map(s => `
                <div class="section-card">
                    <div class="section-header">
                        <h3 class="section-title">${s.title}</h3>
                        ${currentUser.role !== 'viewer' ? `
                            <div style="display:flex; gap:10px;">
                                <button class="btn btn-neon" onclick="openItemModal(null, ${s.id})">+ ITEM</button>
                                <button class="btn btn-danger" onclick="deleteSection(${s.id})">✕</button>
                            </div>
                        ` : ''}
                    </div>
                    <div id="sec-${s.id}">
                        ${items.filter(i => i.section_id === s.id).map(i => `
                            <div class="item-row">
                                <div>
                                    <div style="font-weight:600;">${i.name}</div>
                                    <div style="font-size:11px; color:var(--text-muted);">${i.subtitle || ''}</div>
                                </div>
                                <div style="font-size:12px; font-weight:700; color:var(--neon);">STOCK: ${i.quantity}</div>
                                <div style="font-weight:700;">$${i.price}</div>
                                ${currentUser.role !== 'viewer' ? `
                                    <div style="display:flex; gap:5px;">
                                        <button class="btn btn-neon" style="padding:4px 8px;" onclick="openItemModal(${i.id}, ${s.id})">✎</button>
                                        <button class="btn btn-danger" style="padding:4px 8px;" onclick="deleteItem(${i.id})">✕</button>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('') || '<div style="padding:20px; text-align:center; color:var(--text-muted); font-size:12px;">SECCIÓN VACÍA</div>'}
                    </div>
                </div>
            `).join('');
        }

        function openModal(id) { document.getElementById(id).classList.add('show'); }
        function closeModal(id) { document.getElementById(id).classList.remove('show'); }

        async function saveProfile() {
            const name = document.getElementById('p-name').value;
            const avatar = document.getElementById('p-avatar').value;
            await sb.from('nt_users').update({ name, avatar }).eq('id', currentUser.id);
            window.location.reload();
        }

        async function saveSection() {
            const title = document.getElementById('s-title').value;
            await sb.from('nt_sections').insert({ title, sort_order: sections.length + 1 });
            closeModal('section-modal'); loadInventory();
        }

        async function deleteSection(id) { if(confirm('¿Eliminar sección y sus items?')) { await sb.from('nt_items').delete().eq('section_id', id); await sb.from('nt_sections').delete().eq('id', id); loadInventory(); } }

        function openItemModal(itemId, sectionId) {
            const item = items.find(i => i.id === itemId) || { name: '', subtitle: '', quantity: 0, price: 0 };
            document.getElementById('i-id').value = itemId || '';
            document.getElementById('i-sid').value = sectionId;
            document.getElementById('i-name').value = item.name;
            document.getElementById('i-sub').value = item.subtitle;
            document.getElementById('i-qty').value = item.quantity;
            document.getElementById('i-price').value = item.price;
            document.getElementById('item-modal-title').innerText = itemId ? 'EDITAR ITEM' : 'NUEVO ITEM';
            openModal('item-modal');
        }

        async function saveItem() {
            const id = document.getElementById('i-id').value;
            const section_id = document.getElementById('i-sid').value;
            const name = document.getElementById('i-name').value;
            const subtitle = document.getElementById('i-sub').value;
            const quantity = parseInt(document.getElementById('i-qty').value);
            const price = parseFloat(document.getElementById('i-price').value);
            
            if (id) await sb.from('nt_items').update({ name, subtitle, quantity, price }).eq('id', id);
            else await sb.from('nt_items').insert({ section_id, name, subtitle, quantity, price, sort_order: 99 });
            
            closeModal('item-modal'); loadInventory();
        }

        async function deleteItem(id) { if(confirm('¿Eliminar item?')) { await sb.from('nt_items').delete().eq('id', id); loadInventory(); } }

        init();
    </script>
</body>
</html>
